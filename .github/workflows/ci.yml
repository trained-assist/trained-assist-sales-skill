name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + unit tests + core MCP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies (Node built-ins only) — no npm install needed.
      - name: Require/load every MCP tool
        run: npm run check
      - name: Unit tests (offline)
        run: npm test
      # The same gates trained-assist-agent's deploy.sh runs before it moves this
      # sibling checkout in prod (check-mcp-conformance + check-skill-schedule).
      - uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-agent
          path: .core
          sparse-checkout: scripts
      - name: Core MCP contract (deploy gate)
        run: |
          node .core/scripts/check-mcp-conformance.js .
          node .core/scripts/check-skill-schedule.js .
